services:
  db:
    image: postgres:16

    environment:
      POSTGRES_USER: aduser
      POSTGRES_PASSWORD: adpassword
      POSTGRES_DB: admanager

    ports:
      - "5432:5432"

    volumes:
      - admanager_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U aduser -d admanager"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: migration

    environment:
      DATABASE_URL: postgresql://aduser:adpassword@db:5432/admanager

    depends_on:
      db:
        condition: service_healthy

    restart: "no"

  backend:
    build:
      context: ./backend
      target: runtime

    environment:
      DATABASE_URL: postgresql://aduser:adpassword@db:5432/admanager
      PORT: 8000
      AD_TOKEN_SECRET: ${AD_TOKEN_SECRET:?AD_TOKEN_SECRET is required}

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8000/healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  admanager_postgres_data: